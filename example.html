<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basketball Upload - Demo</title>
  </head>
  <body style="margin: 0; min-height: 100vh; background-color: #0b0f19; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    
    <!-- 1. The container where the widget will live -->
    <div id="my-uploader"></div>

    <!-- 2. Import the component -->
    <script src="./src/BasketballUpload.js"></script>
    
    <!-- 3. Initialize it with just 1 line of code! -->
    <script>
      const uploader = new BasketballUpload('#my-uploader', {
        title: 'Drop your resume or portfolio',
        onFile: (file) => {
          console.log('Successfully captured file:', file);
          alert(`File shot scored! Uploading "${file.name}" (${(file.size / 1024).toFixed(1)} KB)`);
        }
      });
    </script>
  </body>
</html>
